<!-- =========================================
     LOGIN PAGE
========================================= -->

<style>
  /* =========================================
     LOGIN PAGE
  ========================================= */

  .login-page {
    min-height: calc(100vh - 0px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 32px 20px;

    background: #17335f;

    color: #ffffff;
  }

  /* =========================================
     LOGIN CONTAINER
  ========================================= */

  .login-container {
    width: 100%;
    max-width: 390px;

    margin: 0 auto;

    text-align: center;
  }

  /* =========================================
     BRAND
  ========================================= */

  .login-brand {
    margin-bottom: 34px;
  }

  .login-brand-icon {
    width: 76px;
    height: 76px;

    margin: 0 auto 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ffffff;
  }

  .login-brand-icon svg {
    width: 64px;
    height: 64px;

    stroke-width: 1.5;
  }

  .login-brand-title {
    margin: 0;

    color: #ffffff;

    font-size: 28px;
    font-weight: 700;

    line-height: 1.2;

    letter-spacing: -0.5px;
  }

  .login-brand-subtitle {
    margin: 7px 0 0;

    color: rgba(255, 255, 255, 0.82);

    font-size: 13px;
    font-weight: 400;

    line-height: 1.5;
  }

  /* =========================================
     LOGIN FORM
  ========================================= */

  .login-form {
    width: 100%;
  }

  /* =========================================
     FORM GROUP
  ========================================= */

  .login-form-group {
    margin-bottom: 12px;
  }

  /* =========================================
     INPUT WRAPPER
  ========================================= */

  .login-input-wrapper {
    position: relative;

    width: 100%;
  }

  /* =========================================
     INPUT
  ========================================= */

  .login-input {
    width: 100%;
    height: 48px;

    padding: 0 18px;

    border: 1px solid rgba(255, 255, 255, 0.1);

    border-radius: 24px;

    outline: none;

    background: rgba(255, 255, 255, 0.24);

    color: #ffffff;

    font-family: inherit;

    font-size: 14px;

    text-align: left;

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .login-input::placeholder {
    color: rgba(255, 255, 255, 0.78);
  }

  .login-input:hover {
    background: rgba(255, 255, 255, 0.28);
  }

  .login-input:focus {
    background: rgba(255, 255, 255, 0.3);

    border-color: rgba(255, 255, 255, 0.3);

    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
  }

  /* =========================================
     PASSWORD TOGGLE
  ========================================= */

  .login-password-toggle {
    position: absolute;

    top: 50%;
    right: 8px;

    width: 34px;
    height: 34px;

    padding: 0;

    transform: translateY(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    background: transparent;

    color: rgba(255, 255, 255, 0.82);

    cursor: pointer;
  }

  .login-password-toggle:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .login-password-toggle svg {
    width: 18px;
    height: 18px;
  }

  /* =========================================
     LOGIN BUTTON
  ========================================= */

  .login-button {
    width: 100%;
    height: 48px;

    margin-top: 10px;

    border: 0;
    border-radius: 24px;

    background: #2587e8;

    color: #ffffff;

    font-family: inherit;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
      background 0.2s ease,
      transform 0.1s ease,
      box-shadow 0.2s ease;
  }

  .login-button:hover {
    background: #3195f2;

    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }

  .login-button:active {
    transform: translateY(1px);
  }

  /* =========================================
     LOGIN ERROR
  ========================================= */

  .login-error {
    display: none;

    margin: 14px 0 0;

    padding: 10px 14px;

    border-radius: 8px;

    background: rgba(220, 38, 38, 0.16);

    color: #ffffff;

    font-size: 12px;

    line-height: 1.4;

    text-align: center;
  }

  .login-error.is-visible {
    display: block;
  }

  /* =========================================
     FOOTER
  ========================================= */

  .login-footer {
    margin-top: 26px;

    text-align: center;
  }

  .login-footer-main {
    margin: 0;

    color: rgba(255, 255, 255, 0.82);

    font-size: 12px;
  }

  .login-footer-version {
    margin: 5px 0 0;

    color: #d4a84f;

    font-size: 11px;
    font-weight: 600;
  }
  /* =========================================
   LOGIN MODE
========================================= */

  body.login-mode {
    background: #17335f;
  }

  body.login-mode #sidebar {
    display: none !important;
  }

  body.login-mode #navbar {
    display: none !important;
  }

  body.login-mode #content {
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* =========================================
     MOBILE
  ========================================= */

  @media (max-width: 480px) {
    .login-page {
      padding: 24px 20px;
    }

    .login-container {
      max-width: 360px;
    }

    .login-brand {
      margin-bottom: 30px;
    }

    .login-brand-icon {
      width: 68px;
      height: 68px;

      margin-bottom: 14px;
    }

    .login-brand-icon svg {
      width: 56px;
      height: 56px;
    }

    .login-brand-title {
      font-size: 25px;
    }

    .login-brand-subtitle {
      font-size: 12px;
    }

    .login-input,
    .login-button {
      height: 46px;
    }
  }

  /* =========================================
     SMALL SCREEN
  ========================================= */

  @media (max-height: 650px) {
    .login-page {
      padding-top: 20px;
      padding-bottom: 20px;
    }

    .login-brand {
      margin-bottom: 22px;
    }

    .login-brand-icon {
      margin-bottom: 10px;
    }

    .login-footer {
      margin-top: 18px;
    }
  }
</style>

<div class="login-page">
  <div class="login-container">
    <!-- =====================================
         BRAND
    ====================================== -->

    <div class="login-brand">
      <div class="login-brand-icon">
        <i data-lucide="landmark"></i>
      </div>

      <h1 class="login-brand-title">Database Warga</h1>

      <p class="login-brand-subtitle">Kelurahan Aertembaga Dua</p>
    </div>

    <!-- =====================================
         FORM
    ====================================== -->

    <form class="login-form" id="loginForm">
      <!-- USERNAME -->

      <div class="login-form-group">
        <div class="login-input-wrapper">
          <input
            type="text"
            id="loginUsername"
            name="username"
            class="login-input"
            placeholder="Username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <!-- PASSWORD -->

      <div class="login-form-group">
        <div class="login-input-wrapper">
          <input
            type="password"
            id="loginPassword"
            name="password"
            class="login-input"
            placeholder="Password"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="login-password-toggle"
            id="togglePassword"
            aria-label="Tampilkan password"
          >
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <!-- ERROR -->

      <div class="login-error" id="loginError"></div>

      <!-- LOGIN -->

      <button type="submit" class="login-button" id="loginButton">Masuk</button>
    </form>

    <!-- <form class="login-form" id="loginForm"></form> -->

    <!-- =====================================
         FOOTER
    ====================================== -->

    <div class="login-footer">
      <p class="login-footer-main">Sistem Database Warga</p>

      <p class="login-footer-version">Kelurahan Aertembaga Dua</p>
    </div>
  </div>
</div>
