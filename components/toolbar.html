<!-- =========================================
   QEDEV TOOLBAR
========================================= -->

<div class="toolbar">
  <!-- =====================================
         Left
    ====================================== -->

  <div class="toolbar-left">
    <button class="btn btn-primary" id="toolbar-add">
      <i data-lucide="plus"></i>

      Tambah
    </button>

    <button class="btn btn-outline" id="toolbar-edit" disabled>
      <i data-lucide="pencil"></i>

      Edit
    </button>

    <button class="btn btn-outline" id="toolbar-delete" disabled>
      <i data-lucide="trash-2"></i>

      Hapus
    </button>

    <button class="btn btn-outline" id="toolbar-duplicate" disabled>
      <i data-lucide="copy"></i>

      Duplikat
    </button>
  </div>

  <!-- =====================================
         Right
    ====================================== -->

  <div class="toolbar-right">
    <div class="search">
      <i data-lucide="search"></i>

      <input type="text" placeholder="Cari..." />
    </div>

    <button class="btn btn-outline" id="toolbar-filter">
      <i data-lucide="filter"></i>

      Filter
    </button>
  </div>
</div>
